name: book

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "toolchain/fetch.sh"
      - "toolchain/versions.env"
      - "toolchain/env.sh"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "book/**"
      - "toolchain/fetch.sh"
      - "toolchain/versions.env"
      - "toolchain/env.sh"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the book tools
        uses: actions/cache@v4
        with:
          path: |
            toolchain/mdbook
            toolchain/i18n
            toolchain/linkcheck
          key: book-tools-${{ hashFiles('toolchain/versions.env', 'toolchain/fetch.sh') }}

      - name: Fetch the book tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: toolchain/fetch.sh book

      - name: Check links
        run: book/build.sh check

      - name: Build
        env:
          SITE_URL: /${{ github.event.repository.name }}/
        run: book/build.sh all

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r book/out/en/. site/
          cp -r book/out/ja site/ja

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
