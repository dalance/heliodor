# OpenOCD configuration of run_xcheck.sh: one hart behind a remote_bitbang
# server, spike (IDCODE 0xdeadbeef) or the heliodor Verilator wrapper
# (0x10000a03), chosen by XCHECK_IDCODE.
adapter speed     10000
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $::env(REMOTE_BITBANG_PORT)
reset_config none
jtag newtap riscv cpu -irlen 5 -expected-id $::env(XCHECK_IDCODE)
target create riscv.cpu riscv -chain-position riscv.cpu
riscv set_command_timeout_sec 300
init
halt
