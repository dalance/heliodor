# OpenOCD configuration for the 4-hart heliodor SoC on Verilator as one SMP
# target with each hart a hwthread (halt groups halt all harts together).
# Mirrors the riscv-tests spike-2-hwthread.cfg, without the spike-only
# authentication and custom registers.
adapter speed     10000

adapter driver remote_bitbang
remote_bitbang host $::env(REMOTE_BITBANG_HOST)
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10000a03

target create $_CHIPNAME.cpu0 riscv -chain-position $_CHIPNAME.cpu -rtos hwthread
for {set i 1} {$i < 4} {incr i} {
    target create $_CHIPNAME.cpu$i riscv -chain-position $_CHIPNAME.cpu -coreid $i
}
target smp {*}[target names]

gdb_report_data_abort enable
gdb_report_register_access_error enable

foreach t [target names] {
    targets $t
    riscv set_command_timeout_sec $::env(HELIODOR_CMD_TIMEOUT)
    # Expose an unimplemented CSR so we can test non-existent register access
    # behavior.
    riscv expose_csrs 2288
}

riscv resume_order reversed

init

halt

foreach t [target names] {
    targets $t
    arm semihosting enable
}
