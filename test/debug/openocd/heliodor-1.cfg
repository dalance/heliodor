# OpenOCD configuration for the 1-hart heliodor SoC on Verilator
# (sim/verilator/tb_soc_dm.sv) through the tb JTAG DTM's remote_bitbang
# server. Mirrors the riscv-tests spike-1.cfg, without the spike-only
# authentication and custom registers. The simulator is slow, so the RISC-V
# command and reset timeouts are long (HELIODOR_CMD_TIMEOUT seconds).
adapter speed     10000

adapter driver remote_bitbang
remote_bitbang host $::env(REMOTE_BITBANG_HOST)
remote_bitbang port $::env(REMOTE_BITBANG_PORT)

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10000a03

set _TARGETNAME $_CHIPNAME.cpu
if {$::env(USE_FREERTOS)} {
    target create $_TARGETNAME riscv -chain-position $_TARGETNAME -rtos FreeRTOS
} else {
    target create $_TARGETNAME riscv -chain-position $_TARGETNAME
}
$_TARGETNAME configure -work-area-phys $::env(WORK_AREA) -work-area-size 8096 -work-area-backup 1

riscv set_command_timeout_sec $::env(HELIODOR_CMD_TIMEOUT)

gdb_report_data_abort enable
gdb_report_register_access_error enable

# Expose an unimplemented CSR so we can test non-existent register access
# behavior.
riscv expose_csrs 2288

init

halt

arm semihosting enable
