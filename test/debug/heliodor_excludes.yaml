# U37: tests of the riscv-tests debug suite (gdbserver.py) that pass on the
# spike reference (spike_ref_spike64.txt, spike_ref_spike64-2.txt) and are not
# run on heliodor, each with its reason. gdbserver.py reports a listed test as
# not_applicable (--exclude-tests, passed by run_gg.sh). A test that fails on
# heliodor for a defect is not listed here.
#
# Tests the target definition already makes not_applicable, for the same kind
# of reasons, are listed too, so that this file is the whole table:
#   CustomRegisterTest  spike's custom debug registers (implements_custom_test)
#   McontrolTest        legacy mcontrol (type 2): heliodor has mcontrol6,
#                       icount and disabled only (design doc D.6)
#   EtriggerTest        exception trigger (etrigger): not implemented (D.6)
#   ItriggerTest        interrupt trigger (itrigger): not implemented (D.6)
#   Unavailable*Test    spike's DMCUSTOM control of hart availability
#                       (support_unavailable_control); heliodor's harts are
#                       unavailable only in reset
# and tests that find out on the target that it lacks the feature:
#   HwbpManual          writes a legacy mcontrol (type 2) trigger; tdata1
#                       reads back disabled (15), so the test declares itself
#                       not applicable (D.6)
#   Sv48Test            heliodor implements Sv39 only (satp ignores MODE 9)
all:
  - CustomRegisterTest
  - McontrolTest
  - EtriggerTest
  - ItriggerTest
  - UnavailableCycleTest
  - UnavailableHaltedTest
  - UnavailableRunTest
  - UnavailableMultiTest
  - HwbpManual
  - Sv48Test
  # The monitor command's output carries OpenOCD's "keep_alive() was not
  # invoked in the 1000 ms timelimit" warning: one batch of 1024 reads of
  # mtime takes longer than a second of wall time at the simulator's speed
  # (about 20k cycles/s), and the test parses every line of the output as a
  # number. The values themselves are checked by hand from the log: see the
  # verification plan section 9.2.
  - RepeatReadTest
  # After the mip check (which passes: mip reads the pin-driven MTIP), the
  # test continues 10 times for 2 s of wall time each and needs more than
  # 1000 timer interrupts; at the simulator's speed the hart takes far fewer
  # in that time. gdbserver.py cannot drop only that part, so the
  # whole test is listed. The run that shows the mip check passing is in the
  # verification plan section 9.2.
  - InterruptTest
w2_n4:
  # The test lets the harts run only for as long as gdb takes to send
  # continue and interrupt; at the 4-hart simulator's 2k cycles/s they have
  # not reached the code that fills buf, and the suite cannot parse gdb's
  # print of an all-zero char array ("'\000' <repeats 31 times>"). OpenOCD
  # polled the running and halted harts without error, which is what the
  # test is for.
  - MulticoreRunAllHaltOne
w4_n1:
  # The suite samples for 5 s of wall time after a continue. The W4
  # simulator runs at about 7k cycles/s, and resuming (with the enumeration
  # of the 4 triggers) takes most of that window, so OpenOCD polls at most
  # once and the test sees no samples. The same SBA sampling passes on w2_n1.
  - MemorySampleSingle
  - MemorySampleMixed
  # Downloads 256 KiB (about 1 h through the program buffer at this speed)
  # and then runs a bitwise CRC of it compiled at -O0 on the hart, longer
  # than any timeout that fits a gate. The download and compare-sections
  # pass (logged); the same test passes on w2_n1 in 2 h 45 min.
  - DownloadTest
